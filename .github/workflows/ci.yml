name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Check CLI entrypoint
        run: |
          python -m no_watermar.cli --help
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

  disposable_evidence:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Capture disposable stable evidence
        run: |
          python ./tools/benchmark/capture-disposable-evidence.py --workspace-root ./runtime/ci-disposable-evidence --clean
      - name: Package disposable evidence bundle
        run: |
          python ./tools/releases/package-evidence.py --evidence-root ./runtime/ci-disposable-evidence/benchmarks/evidence --output-dir ./runtime/ci-disposable-evidence/package --bundle-name disposable-evidence-${{ matrix.os }}
      - name: Upload disposable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: disposable-evidence-${{ matrix.os }}
          path: runtime/ci-disposable-evidence/package/*

  package:
    needs: [test, disposable_evidence]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Build distribution artifacts
        run: |
          python -m build
      - name: Check distribution metadata
        run: |
          python -m twine check dist/*
