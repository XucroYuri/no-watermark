name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Check CLI entrypoint
        run: |
          python -m no_watermar.cli --help
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
      - name: Capture disposable stable evidence
        run: |
          python ./tools/benchmark/capture-disposable-evidence.py --workspace-root ./runtime/release-disposable-evidence --clean
      - name: Package disposable evidence bundle
        run: |
          python ./tools/releases/package-evidence.py --evidence-root ./runtime/release-disposable-evidence/benchmarks/evidence --output-dir ./runtime/release-disposable-evidence/package --bundle-name disposable-evidence
      - name: Build distribution artifacts
        run: |
          python -m build
      - name: Check distribution metadata
        run: |
          python -m twine check dist/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
      - name: Upload disposable evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: disposable-evidence
          path: runtime/release-disposable-evidence/package/*

  github_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Download disposable evidence bundle
        uses: actions/download-artifact@v8
        with:
          name: disposable-evidence
          path: evidence
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            evidence/*
          generate_release_notes: true

  publish_pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
